services:
  # Backend API Service
  - type: web
    name: baba-ayurveda-backend
    env: python
    region: oregon
    plan: free
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PRODUCTION_FRONTEND_URL
        sync: false
      - key: CUSTOM_DOMAIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BIGSHIP_USERNAME
        sync: false
      - key: BIGSHIP_PASSWORD
        sync: false
      - key: BIGSHIP_ACCESS_KEY
        sync: false
      - key: BIGSHIP_DEFAULT_WAREHOUSE_ID
        sync: false
      - key: BIGSHIP_PICKUP_PINCODE
        sync: false

  # Frontend Static Site
  - type: web
    name: baba-ayurveda-frontend
    env: static
    branch: main
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_MSG91_AUTH_KEY
        sync: false
      - key: VITE_MSG91_WIDGET_ID
        sync: false
      - key: VITE_MSG91_TOKEN_AUTH
        sync: false
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
      - key: VITE_API_BASE_URL
        sync: false
